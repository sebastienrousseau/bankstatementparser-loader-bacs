[tool.poetry]
name = "bankstatementparser-loader-bacs"
version = "0.0.36"
description = "BACS Standard 18 / Faster Payments UK banking statement loader for bankstatementparser."
authors = ["Sebastien Rousseau <sebastian.rousseau@gmail.com>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/sebastienrousseau/bankstatementparser-loader-bacs"
homepage = "https://bankstatementparser.com"
keywords = ["bacs", "std18", "faster-payments", "uk-banking", "statement", "transactions"]
packages = [
    { include = "bankstatementparser_loader_bacs" },
]

[tool.poetry.plugins."bankstatementparser.loaders"]
bacs = "bankstatementparser_loader_bacs.loader:BacsStatementParser"
std18 = "bankstatementparser_loader_bacs.loader:BacsStatementParser"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
bankstatementparser = ">=0.0.35"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3,<10.0.0"
pytest-cov = "^7.1.0"
pytest-benchmark = "^5.1.0"
ruff = ">=0.15.7,<0.18"
mypy = ">=1.5,<3"
bandit = "^1.7.0"
hypothesis = ">=6.82,<7"
interrogate = "^1.7.0"
# tests/test_suite_conformance.py parses pyproject.toml. tomllib is
# stdlib only from 3.11 and the suite floor is 3.10, so without the
# backport the conformance gate does not run there at all.
tomli = { version = ">=2", python = "<3.11" }
packaging = ">=23"
build = "^1.6.1"
# pip-audit pulls filelock (via cachecontrol[filecache]). Every filelock
# up to 4.2.0 carries advisories and 4.2.1 needs Python 3.11, so pip-audit
# is installed on 3.11+ only (its CI job runs on 3.12) and the floor keeps
# any affected filelock from resolving.
pip-audit = { version = "^2.10.1", python = ">=3.11" }
filelock = { version = ">=4.2.1", python = ">=3.11" }

# The user manual (mkdocs.yml, deployed to GitHub Pages by
# .github/workflows/docs.yml). CI installs requirements/docs.txt, the
# hashed export of this group. mkdocs-material 9.8 needs Python 3.11, and
# the manual is built on 3.12 only, so the group is marked to match.
[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs-material = { version = "^9.8", python = ">=3.11" }
mkdocstrings = { version = ">=1.0", python = ">=3.11", extras = ["python"] }

# Coverage-guided fuzzing of the BACS loader (fuzz/fuzz_load_bacs.py, run
# by the CI "Fuzz" job). Atheris ships wheels for Linux x86_64 on CPython
# 3.12+ only and no sdist, so the group is optional and marked to match.
[tool.poetry.group.fuzz]
optional = true

[tool.poetry.group.fuzz.dependencies]
atheris = { version = "^3.1.0", python = ">=3.12", markers = "sys_platform == 'linux' and platform_machine == 'x86_64'" }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
# The vendored conformance test carries a sha256 of its own bytes.
# It is maintained centrally in the core; letting ruff rewrite
# it here invalidates the very check it exists to make. Same
# exclusion as the core.
line-length = 79
target-version = "py310"
extend-exclude = [
    "*.md",
    "tmp_env",
    ".venv",
    ".eggs",
    "tests/test_suite_conformance.py",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "bankstatementparser.*",
    "pandas.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "bankstatementparser_loader_bacs.loader"
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[tool.interrogate]
ignore-init-method = false
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
fail-under = 100
exclude = ["setup.py", "docs", "build", "tests", ".venv"]
verbose = 2
quiet = false
color = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=bankstatementparser_loader_bacs --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=100"
