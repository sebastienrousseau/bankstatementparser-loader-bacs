[tool.poetry]
name = "bankstatementparser-loader-bacs"
version = "0.0.35"
description = "BACS Standard 18 / Faster Payments UK banking statement loader for bankstatementparser."
authors = ["Sebastien Rousseau <sebastian.rousseau@gmail.com>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/sebastienrousseau/bankstatementparser-loader-bacs"
homepage = "https://bankstatementparser.com"
keywords = ["bacs", "std18", "faster-payments", "uk-banking", "statement", "transactions"]
packages = [
    { include = "bankstatementparser_loader_bacs" },
]

[tool.poetry.plugins."bankstatementparser.loaders"]
bacs = "bankstatementparser_loader_bacs.loader:BacsStatementParser"
std18 = "bankstatementparser_loader_bacs.loader:BacsStatementParser"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
bankstatementparser = ">=0.0.34"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3,<10.0.0"
pytest-cov = "^7.1.0"
pytest-benchmark = "^5.1.0"
ruff = ">=0.15.7,<0.17"
mypy = ">=1.5,<3"
bandit = "^1.7.0"
hypothesis = ">=6.82,<7"
interrogate = "^1.7.0"
# tests/test_suite_conformance.py parses pyproject.toml. tomllib is
# stdlib only from 3.11 and the suite floor is 3.10, so without the
# backport the conformance gate does not run there at all.
tomli = { version = ">=2", python = "<3.11" }
packaging = ">=23"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 79
target-version = "py310"
extend-exclude = ["*.md", "tmp_env", ".venv", ".eggs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "bankstatementparser.*",
    "pandas.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "bankstatementparser_loader_bacs.loader"
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[tool.interrogate]
ignore-init-method = false
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
fail-under = 100
exclude = ["setup.py", "docs", "build", "tests", ".venv"]
verbose = 2
quiet = false
color = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=bankstatementparser_loader_bacs --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=100"
