name: PR Gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: PR sanity checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install this package + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov pytest-benchmark interrogate hypothesis bandit 'tomli; python_version<"3.11"' ruff mypy

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy bankstatementparser_loader_bacs tests

      - name: Version agreement
        run: python3 scripts/verify_versions.py

      - name: Tests with 100% coverage gate
        run: |
          # --cov, --cov-branch and the 100% floor come from
          # pyproject.toml, so a local `pytest` enforces exactly this.
          pytest tests/ --cov-report=xml --cov-report=term

      - name: Docstring coverage
        run: interrogate -c pyproject.toml bankstatementparser_loader_bacs

      - name: Security audit with Bandit
        run: bandit -r bankstatementparser_loader_bacs -c pyproject.toml
